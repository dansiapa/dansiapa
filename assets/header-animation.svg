<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="250" viewBox="0 0 850 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="headerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="250" rx="15" fill="url(#headerBg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="850" y2="50" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="850" y2="100" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="850" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="850" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="250" stroke="#00d4ff" stroke-width="0.5"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="50" cy="50" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="cy" values="50;30;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="200" r="3" fill="#7c3aed" opacity="0.5">
    <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="80" r="2" fill="#f472b6" opacity="0.7">
    <animate attributeName="cy" values="80;60;80" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="180" r="2" fill="#00d4ff" opacity="0.5">
    <animate attributeName="cy" values="180;160;180" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Code brackets left -->
  <text x="30" y="140" font-family="JetBrains Mono, Fira Code, monospace" font-size="60" fill="url(#textGradient)" opacity="0.3" filter="url(#headerGlow)">{</text>
  
  <!-- Main greeting -->
  <text x="100" y="80" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" fill="#64748b">// Welcome to my GitHub profile</text>
  
  <!-- Name -->
  <text x="100" y="130" font-family="Poppins, Inter, Arial Black, sans-serif" font-size="45" font-weight="800" fill="white" filter="url(#headerGlow)">
    Hi, I'm <tspan fill="url(#textGradient)">Rangga Putra</tspan>
  </text>
  
  <!-- Typing animation for role -->
  <text x="100" y="175" font-family="JetBrains Mono, Fira Code, monospace" font-size="20" fill="#00d4ff">
    <tspan fill="#f472b6">&gt;</tspan> Software Developer
    <tspan fill="#7c3aed">|</tspan>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="210" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Building secure &amp; scalable solutions from Indonesia 🇮🇩</text>
  
  <!-- Code brackets right -->
  <text x="780" y="140" font-family="JetBrains Mono, Fira Code, monospace" font-size="60" fill="url(#textGradient)" opacity="0.3" filter="url(#headerGlow)">}</text>
  
  <!-- Decorative line -->
  <rect x="100" y="225" width="650" height="2" rx="1" fill="url(#textGradient)" opacity="0.5"/>
</svg>
