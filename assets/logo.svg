<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for accent -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="url(#accentGradient)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- Code brackets decoration -->
  <text x="25" y="115" font-family="JetBrains Mono, Fira Code, monospace" font-size="50" font-weight="bold" fill="url(#accentGradient)" opacity="0.6" filter="url(#glow)">&lt;</text>
  <text x="155" y="115" font-family="JetBrains Mono, Fira Code, monospace" font-size="50" font-weight="bold" fill="url(#accentGradient)" opacity="0.6" filter="url(#glow)">/&gt;</text>
  
  <!-- Main initials "RP" -->
  <text x="100" y="120" font-family="Poppins, Inter, Arial, sans-serif" font-size="55" font-weight="800" fill="white" text-anchor="middle" filter="url(#glow)">RP</text>
  
  <!-- Subtitle -->
  <text x="100" y="145" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#00d4ff" text-anchor="middle" letter-spacing="2">DEVELOPER</text>
  
  <!-- Decorative dots -->
  <circle cx="60" cy="55" r="3" fill="#00d4ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="55" r="3" fill="#7c3aed" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="40" r="2" fill="#f472b6" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Binary decoration -->
  <text x="45" y="170" font-family="monospace" font-size="6" fill="#00d4ff" opacity="0.4">01101</text>
  <text x="140" y="170" font-family="monospace" font-size="6" fill="#7c3aed" opacity="0.4">10110</text>
</svg>
