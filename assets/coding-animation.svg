<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="codeGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Monitor frame -->
  <rect x="30" y="20" width="340" height="220" rx="10" fill="#2d2d3a" stroke="#3d3d4a" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="40" y="30" width="320" height="180" rx="5" fill="url(#screenGrad)"/>
  
  <!-- Window controls -->
  <circle cx="55" cy="45" r="5" fill="#ff5f57"/>
  <circle cx="75" cy="45" r="5" fill="#ffbd2e"/>
  <circle cx="95" cy="45" r="5" fill="#28ca42"/>
  
  <!-- Code lines with typing animation -->
  <g filter="url(#codeGlow)">
    <!-- Line 1 -->
    <text x="55" y="80" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c3aed">class</text>
    <text x="95" y="80" font-family="JetBrains Mono, monospace" font-size="11" fill="#00d4ff">Developer</text>
    <text x="175" y="80" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">{</text>
    
    <!-- Line 2 -->
    <text x="70" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c3aed">String</text>
    <text x="115" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">name =</text>
    <text x="170" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#f472b6">"Rangga"</text>
    <text x="235" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">;</text>
    
    <!-- Line 3 -->
    <text x="70" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c3aed">String[]</text>
    <text x="130" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">skills = {</text>
    
    <!-- Line 4 -->
    <text x="85" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#f472b6">"Java"</text>
    <text x="130" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">,</text>
    <text x="140" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#f472b6">"Rust"</text>
    <text x="185" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">,</text>
    <text x="195" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#f472b6">"Python"</text>
    
    <!-- Line 5 -->
    <text x="70" y="160" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">};</text>
    
    <!-- Line 6 -->
    <text x="70" y="180" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c3aed">boolean</text>
    <text x="130" y="180" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">passionate =</text>
    <text x="230" y="180" font-family="JetBrains Mono, monospace" font-size="11" fill="#28ca42">true</text>
    <text x="260" y="180" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8f8f2">;</text>
    
    <!-- Cursor blinking -->
    <rect x="270" y="170" width="8" height="14" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Monitor stand -->
  <rect x="170" y="240" width="60" height="15" rx="2" fill="#2d2d3a"/>
  <rect x="150" y="255" width="100" height="10" rx="5" fill="#2d2d3a"/>
  
  <!-- Keyboard -->
  <rect x="100" y="275" width="200" height="20" rx="3" fill="#2d2d3a" stroke="#3d3d4a"/>
  <g fill="#3d3d4a">
    <rect x="110" y="280" width="15" height="10" rx="1"/>
    <rect x="130" y="280" width="15" height="10" rx="1"/>
    <rect x="150" y="280" width="15" height="10" rx="1"/>
    <rect x="170" y="280" width="15" height="10" rx="1"/>
    <rect x="190" y="280" width="15" height="10" rx="1"/>
    <rect x="210" y="280" width="15" height="10" rx="1"/>
    <rect x="230" y="280" width="15" height="10" rx="1"/>
    <rect x="250" y="280" width="15" height="10" rx="1"/>
    <rect x="270" y="280" width="15" height="10" rx="1"/>
  </g>
  
  <!-- Coffee cup -->
  <ellipse cx="355" cy="275" rx="15" ry="5" fill="#6b4423"/>
  <rect x="340" y="260" width="30" height="20" rx="3" fill="#8b5a2b"/>
  <path d="M 370 265 Q 380 265 380 275 Q 380 285 370 280" stroke="#8b5a2b" stroke-width="3" fill="none"/>
  <!-- Steam -->
  <path d="M 350 255 Q 352 250 350 245" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5">
    <animate attributeName="d" values="M 350 255 Q 352 250 350 245;M 350 255 Q 348 250 350 245;M 350 255 Q 352 250 350 245" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 358 253 Q 360 248 358 243" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5">
    <animate attributeName="d" values="M 358 253 Q 360 248 358 243;M 358 253 Q 356 248 358 243;M 358 253 Q 360 248 358 243" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>
